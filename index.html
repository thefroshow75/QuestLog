<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Quest Log MK2</title>
      <link rel="stylesheet" href="style.css">
</head>
<body>
      <nav class="TopBar">
            <button type="button" class="NavButton" data-target="ElevatorPanel">Agents</button>
            <div class="Profile">
                  <h1 id="Username">Username</h1>
                  <h2 id="UserLevel">Level 1</h2>
            </div>
            <button type="button" class="NavButton" data-target="QuestPanel">Quests</button>
      </nav>

      <main class="Layout">
            <section id="ElevatorPanel" class="Elevator">
                  <header class="PanelHeader">
                        <h2>Agent Elevator</h2>
                        <p class="PanelHint">Select an agent to chat and view their tools.</p>
                  </header>
                  <div id="Elevator" class="FloorList">
                        <!-- Floors rendered via script.js -->
                  </div>
            </section>

            <section class="Room">
                  <article class="AI" id="AI">
                        <header class="PanelHeader">
                              <h1>Welcome to Quest Log MK2</h1>
                              <p>Your personal quest management system.</p>
                        </header>
                        <div class="ChatBox">
                              <div class="Messages" id="chatLog"></div>
                              <div class="ChatInput">
                                    <input type="text" placeholder="Type your message..." id="userInput">
                                    <button type="button" id="SendButton">Send</button>
                              </div>
                        </div>
                  </article>
                  <aside class="Player">
                        <div class="ToolBar" id="ToolBar">
                              <!-- Tool buttons rendered via script.js -->
                        </div>
                  </aside>
            </section>

            <section id="QuestPanel" class="Quests">
                  <header class="PanelHeader">
                        <h2>Active Quests</h2>
                        <button id="AddQuestButton" type="button">+</button>
                  </header>

                  <form id="AddQuestForm" class="hidden FormCard">
                        <label>
                              <span>Quest Title</span>
                              <input type="text" id="NewQuestTitle" placeholder="Quest Title">
                        </label>
                        <label>
                              <span>Description</span>
                              <textarea id="NewQuestDescription" placeholder="Quest Description"></textarea>
                        </label>
                        <button type="submit">Add Quest</button>
                  </form>

                  <div id="QuestList" class="QuestList">
                        <!-- Quests rendered via script.js -->
                  </div>
                  <section class="TaskQueuePanel">
                        <header class="PanelHeader">
                              <h2>QuestBoard Tasks</h2>
                              <div class="TaskQueueActions">
                                    <button id="RefreshTasksButton" type="button">Refresh</button>
                                    <button id="ProcessTaskButton" type="button">Process Next</button>
                              </div>
                        </header>
                        <div id="TaskQueueList" class="TaskQueueList">
                              <!-- Task queue rendered via script.js -->
                        </div>
                  </section>
            </section>
      </main>

      <script src="script.js"></script>
</body>
</html>
